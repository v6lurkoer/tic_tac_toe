<!DOCTYPE html>
<html lang="en">
  <head>
    <title>Tic Tac Toe</title>
    <meta charset="UTF-8"/>
    <link href="./style.css" rel="stylesheet"/>
    <script src="./script.js" defer></script>
  </head>
  <body>
    <header>
      <h1>Tic Tac Toe</h1>
    </header>
    <div id="container">
      <div id="newGameButtonContainer">
        <button id="newGameButton">NEW GAME</button>
      </div>
      <div id="gameContainer">
        <div id="gameBoard">
          <div><button class="boardSquare" data-array-index="0"></button></div>
          <div><button class="boardSquare" data-array-index="1"></button></div>
          <div><button class="boardSquare" data-array-index="2"></button></div>
          <div><button class="boardSquare" data-array-index="3"></button></div>
          <div><button class="boardSquare" data-array-index="4"></button></div>
          <div><button class="boardSquare" data-array-index="5"></button></div>
          <div><button class="boardSquare" data-array-index="6"></button></div>
          <div><button class="boardSquare" data-array-index="7"></button></div>
          <div><button class="boardSquare" data-array-index="8"></button></div>
        </div>
        <div>
        </div>
      </div>
    </div>
  </body>
</html>
